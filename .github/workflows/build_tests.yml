name: Run Build Tests
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build_tests:
    uses: OpenVoiceOS/gh-automations/.github/workflows/build-tests.yml@dev
    with:
      python_versions: '["3.12", "3.13", "3.14"]'
      # TEMPORARY until ovos-plugin-manager 3.0.0a1 (media-backend-v2) publishes to PyPI:
      # pull the v2 template straight from its feature branch so CI installs the
      # contract this plugin was ported against.
      install_extras: "test"
      # TEMPORARY until ovos-plugin-manager 3.0.0a1 releases: pull the
      # media-backend-v2 template ahead of the wheel's v1-floored dependency.
      pre_install_pip: "git+https://github.com/OpenVoiceOS/ovos-plugin-manager@feat/media-backend-v2"
      test_path: "test/"
    secrets: inherit
