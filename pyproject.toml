[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-media-plugin-mass"
dynamic = ["version"]
description = "Music Assistant playback backend for OVOS (ovos-media / ovos-audio)"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{name = "JarbasAi", email = "jarbasai@mailfence.com"}]
requires-python = ">=3.12"
keywords = ["ovos", "OpenVoiceOS", "OCP", "media", "audio", "music-assistant", "plugin"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "ovos-plugin-manager>=2.1.0,<3.0.0",
    "ovos-config>=0.0.12",
    "py-music-assistant>=0.0.1",
]

[project.optional-dependencies]
test = ["pytest", "pytest-cov", "ovoscope[audio]"]

[project.urls]
Homepage = "https://github.com/OpenVoiceOS/ovos-media-plugin-mass"
Repository = "https://github.com/OpenVoiceOS/ovos-media-plugin-mass"

[project.scripts]
ovos-mass-autoconfigure = "ovos_media_plugin_mass.autoconfigure:main"

[project.entry-points."mycroft.plugin.audioservice"]
ovos_mass = "ovos_media_plugin_mass.audio:MAssAudioService"

[project.entry-points."opm.media.audio"]
ovos-media-audio-plugin-mass = "ovos_media_plugin_mass.media:MAssOCPAudioService"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["ovos_media_plugin_mass*"]

[tool.setuptools.dynamic]
version = {attr = "ovos_media_plugin_mass.version.__version__"}
